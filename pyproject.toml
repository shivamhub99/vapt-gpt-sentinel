[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vapt-sentinel"
version = "0.1.0"
description = "DEFENSIVE closed-loop vulnerability remediation and attack-path digital twin framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Research Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "networkx>=3.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.31.0",
    "typer>=0.9.0",
    "gitpython>=3.1.40",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests", "lab/sentinel-lab-app/tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --import-mode=importlib"


[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "B", "I", "S"]
lint.ignore = [
    "S101", # allow assert in tests
    "S603", # subprocess calls in controlled wrappers
    "S607", # partial executable paths
]

[tool.ruff.lint.per-file-ignores]
"lab/sentinel-lab-app/*" = ["S104", "S105", "S608", "S201", "S113"] # Planted issues & container binding for research lab

